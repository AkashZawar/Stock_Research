        <section id="tradeView" class="tab-view is-hidden">
          <section class="monitor-header">
            <div>
              <p class="eyebrow">Trade References</p>
              <h2>Saved buy and sell levels</h2>
              <p class="muted">Keep planned buy, sell, and stop levels for review before the next trade.</p>
            </div>
            <button type="button" id="useCurrentReport">Use Current Report</button>
          </section>

          <section id="tradeError" class="error-state is-hidden"></section>

          <section class="trade-grid">
            <article class="analysis-panel panel-accent-teal">
              <h3>Add Reference</h3>
              <form id="tradeForm" class="trade-form">
                <label>
                  <span>Symbol</span>
                  <input id="tradeSymbol" name="symbol" placeholder="ABBOTINDIA.NS" autocomplete="off" required>
                </label>
                <label>
                  <span>Stock name</span>
                  <input id="tradeStockName" name="stockName" placeholder="Abbott India" autocomplete="off">
                </label>
                <label>
                  <span>Buy price</span>
                  <input id="tradeBuyPrice" name="buyPrice" type="number" step="0.01" min="0" required>
                </label>
                <label>
                  <span>Sell price</span>
                  <input id="tradeSellPrice" name="sellPrice" type="number" step="0.01" min="0" required>
                </label>
                <label>
                  <span>Stop loss</span>
                  <input id="tradeStopLoss" name="stopLoss" type="number" step="0.01" min="0">
                </label>
                <label>
                  <span>Status</span>
                  <select id="tradeStatus" name="status">
                    <option value="watch">Watch</option>
                    <option value="active">Active</option>
                    <option value="closed">Closed</option>
                  </select>
                </label>
                <label class="trade-note-field">
                  <span>Note</span>
                  <textarea id="tradeNote" name="note" rows="3" placeholder="Reason, trigger, result date, or chart condition"></textarea>
                </label>
                <button type="submit">Save Reference</button>
              </form>
            </article>

            <article class="analysis-panel panel-accent-blue">
              <div class="section-head">
                <h3>Saved References</h3>
                <span id="tradeCount" class="pill">0 saved</span>
              </div>
              <section id="tradeLoading" class="loading-state compact is-hidden">
                <div class="spinner"></div>
                <p>Loading references...</p>
              </section>
              <div class="table-wrap">
                <table class="monitor-table trade-table">
                  <thead>
                    <tr>
                      <th>Stock</th>
                      <th>Buy</th>
                      <th>Sell</th>
                      <th>Upside</th>
                      <th>Stop</th>
                      <th>Status</th>
                      <th></th>
                    </tr>
                  </thead>
                  <tbody id="tradeRows"></tbody>
                </table>
              </div>
            </article>
          </section>
        </section>
